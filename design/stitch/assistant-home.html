<!DOCTYPE html>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Walaa Cashier - Home</title>

                        "canvas": "#F7F8FA",

                        "padding-card-mobile": "16px",
                        "padding-card-web": "24px",

<style>
        body {
            background-color: theme('colors.canvas');
            color: theme('colors.on-surface');
            -webkit-tap-highlight-color: transparent;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-[884px] flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="bg-pure-surface dark:bg-surface-container-highest text-primary dark:text-primary-fixed fixed top-0 w-full z-50 border-b border-whisper-border shadow-sm flex flex-row-reverse justify-between items-center px-gutter h-16 w-full">
<div class="flex items-center gap-3 flex-row-reverse">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center overflow-hidden flex-shrink-0">
<span class="material-symbols-outlined text-primary">store</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-bold truncate">سوبر ماركت الرشيد</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-[#1E7B4D]">متصل</span>
<span class="material-symbols-outlined text-[#1E7B4D] text-sm">sync</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-24 px-gutter py-6 flex flex-col gap-6 overflow-y-auto">
<!-- Shift Summary Row -->
<section class="grid grid-cols-3 gap-3">
<div class="bg-pure-surface rounded-xl p-3 border border-whisper-border shadow-sm flex flex-col items-center justify-center gap-1 text-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">فواتير اليوم</span>
<span class="font-amount-display text-lg font-semibold text-primary">84</span>
</div>
<div class="bg-pure-surface rounded-xl p-3 border border-whisper-border shadow-sm flex flex-col items-center justify-center gap-1 text-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">زبائن جدد</span>
<span class="font-amount-display text-lg font-semibold text-primary">12</span>
</div>
<div class="bg-pure-surface rounded-xl p-3 border border-whisper-border shadow-sm flex flex-col items-center justify-center gap-1 text-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">قيد المزامنة</span>
<span class="font-amount-display text-lg font-semibold text-primary">0</span>
</div>
</section>
<!-- Quick Actions Grid -->
<section class="grid grid-cols-2 gap-4 mt-2">
<button class="bg-pure-surface border border-whisper-border rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-sm hover:bg-surface-container-low active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-teal-tint flex items-center justify-center">
<span class="material-symbols-outlined text-primary fill">receipt_long</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">استرجاع فاتورة</span>
</button>
<button class="bg-pure-surface border border-whisper-border rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-sm hover:bg-surface-container-low active:scale-95 transition-all">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">inventory_2</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">جرد المخزون</span>
</button>
</section>
<div class="flex-1"></div>
<!-- Primary Action Area (Thumb Zone) -->
<section class="flex flex-col gap-4 mt-auto">
<button class="w-full bg-[#0F6E56] text-on-primary rounded-xl p-6 min-h-[120px] flex flex-col items-center justify-center gap-4 shadow-md active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-4xl">barcode_scanner</span>
<span class="font-headline-md text-xl font-bold">بدء عملية جديدة</span>
</button>
<button class="w-full bg-transparent border border-whisper-border text-primary rounded-xl p-4 min-h-[48px] flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">person_add</span>
<span class="font-label-sm text-label-sm font-semibold">تسجيل زبون جديد</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-pure-surface dark:bg-surface-container-highest fixed bottom-0 w-full z-50 rounded-t-xl border-t border-whisper-border shadow-[0_-2px_10px_rgba(0,0,0,0.04)] flex flex-row-reverse justify-around items-center h-20 w-full px-4 pb-safe">
<!-- Active Tab: الرئيسية -->
<button class="flex flex-col items-center justify-center text-primary font-bold bg-teal-tint rounded-xl py-1 px-4 active:scale-90 transition-transform">
<span class="material-symbols-outlined fill" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">الرئيسية</span>
</button>
<!-- Inactive Tab: العمليات -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high rounded-xl py-1 px-4 active:scale-90 transition-transform">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="font-label-sm text-label-sm mt-1">العمليات</span>
</button>
<!-- Inactive Tab: حسابي -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high rounded-xl py-1 px-4 active:scale-90 transition-transform">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">حسابي</span>
</button>
</nav>
