<body class="bg-canvas text-on-background min-h-[884px] flex flex-col items-center justify-start pb-safe">

<!-- Headline / Brand -->
<h1 class="font-headline-md text-headline-md text-primary font-bold flex-1 text-center">

<!-- Customer Context (Optional brief info if not fully in header) -->
<div class="flex items-center gap-3 bg-pure-surface p-4 rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-whisper-border">
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-variant shrink-0 relative">
<img class="w-full h-full object-cover" data-alt="A clean, modern corporate headshot avatar of an individual, well-lit against a neutral light grey background, conveying professionalism and reliability in a corporate retail setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPwFyut07G9kZQqENG99f5kHylax20nayXWkLCtRr5CchD2s6NKjgmXtos5PtwMvnx0mCmmsQe4kpyBtPh7CakfkuL7BNUiE2OMUnMm8cMAsisVRnboEnJ3pM-XM4uun58mOHNjbqCsqnNjgOwBXRa4BhMmzsOkn4Ocu1mcPtMPThaU3I6Sd3Ok1gUNpFt_xVzf05IFmVHvTfyr89-REfk9o7K5R3l_4UG90giRz6jXc8a2ikBYO2YRQ"/>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">العميل</p>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">مصطفى عبد الله</p>
</div>
</div>
<!-- Default State: Redeem Coupon -->
<section class="flex flex-col gap-6 w-full animate-fade-in" id="redeem-section">
<!-- Hero Coupon Card -->
<div class="bg-teal-tint rounded-2xl p-6 flex flex-col items-center justify-center text-center relative overflow-hidden border-dashed-custom">
<!-- Status Pill (Active) -->

</div>

                    </p>
</div>

<button class="w-full min-h-[52px] bg-primary text-on-primary rounded-xl font-label-sm text-label-sm font-semibold active-press transition-transform shadow-sm flex items-center justify-center gap-2" id="btn-confirm">
<span class="material-symbols-outlined" data-icon="check">check</span>
                تأكيد استخدام الكوبون
            </button>
<button class="w-full min-h-[48px] bg-transparent border border-whisper-border text-on-surface-variant rounded-xl font-label-sm text-label-sm font-medium active-press transition-transform flex items-center justify-center hover:bg-surface-container-lowest" id="btn-cancel">
                إلغاء
            </button>
<button class="hidden w-full min-h-[52px] bg-surface-container-lowest border border-outline-variant text-on-surface rounded-xl font-label-sm text-label-sm font-medium active-press transition-transform items-center justify-center" id="btn-back-home">
                العودة للرئيسية
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnConfirm = document.getElementById('btn-confirm');
            const btnCancel = document.getElementById('btn-cancel');
            const btnBackHome = document.getElementById('btn-back-home');
            
            const redeemSection = document.getElementById('redeem-section');
            const successSection = document.getElementById('success-section');
            const topAppBar = document.getElementById('top-app-bar');

            // Simulate Confirm Action
            btnConfirm.addEventListener('click', () => {
                // Add simple loading state
                const originalText = btnConfirm.innerHTML;
                btnConfirm.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> جاري التفعيل...';
                btnConfirm.disabled = true;

                setTimeout(() => {
                    // Transition to Success State
                    redeemSection.classList.add('hidden');
                    successSection.classList.remove('hidden');
                    successSection.classList.add('flex', 'animate-fade-in');
                    
                    // Update Actions
                    btnConfirm.classList.add('hidden');
                    btnCancel.classList.add('hidden');
                    btnBackHome.classList.remove('hidden');
                    btnBackHome.classList.add('flex');
                    
                    // Update Header slightly to reflect terminal state
                    const headerTitle = topAppBar.querySelector('h1');
                    if(headerTitle) headerTitle.textContent = 'تفاصيل الكوبون';

                }, 800);
            });

            // Simulate Cancel Action (Just visual feedback for demo)
            btnCancel.addEventListener('click', () => {
                btnCancel.classList.add('bg-surface-variant');
                setTimeout(() => btnCancel.classList.remove('bg-surface-variant'), 150);
            });
            
            btnBackHome.addEventListener('click', () => {
                 window.location.reload(); // Simple reset for demo purposes
            });
        });
    </script>
