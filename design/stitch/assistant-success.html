<body class="bg-canvas text-charcoal-ink antialiased min-h-[884px] flex flex-col items-center justify-center relative overflow-x-hidden md:py-8">
<!-- TopAppBar Nav Shell (Hidden on this transactional page per rules, just semantic wrapper) -->
<!-- Suppressed due to Transactional/Success intent -->
<main class="w-full max-w-md mx-auto flex-grow flex flex-col justify-between px-gutter pb-[100px] md:pb-gutter pt-8 z-10">
<!-- Center Content Area -->
<div class="flex-grow flex flex-col items-center justify-center space-y-8 mt-12 md:mt-0">
<!-- Success Animation Container -->
<div class="w-48 h-48 relative flex items-center justify-center">

</div>
<!-- Headline -->
<h1 class="font-headline text-3xl font-bold text-charcoal-ink text-center">تم ربط الفاتورة بنجاح</h1>
<!-- Receipt/Summary Card -->
<div class="w-full bg-pure-surface rounded-xl shadow-sm border border-whisper-border p-padding-card-mobile flex flex-col space-y-5">
<!-- Customer Row -->
<div class="flex items-center justify-between pb-4 border-b border-whisper-border">
<span class="text-secondary font-medium">الزبون</span>
<div class="flex items-center space-x-3 space-x-reverse">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant flex items-center justify-center">
<!-- Simple avatar placeholder -->
<span class="material-symbols-outlined text-secondary text-sm">person</span>
</div>
<span class="font-semibold text-on-surface">زينب كاظم</span>
</div>
</div>
<!-- Invoice Amount Row -->
<div class="flex items-center justify-between">
<span class="text-secondary font-medium">مبلغ الفاتورة</span>
<span class="font-mono text-xl font-semibold text-charcoal-ink">62,000 د.ع</span>
</div>
<!-- Cumulative Balance Row -->
<div class="flex items-center justify-between bg-surface-container-low p-3 rounded-lg border border-whisper-border">
<span class="text-on-surface font-medium">الرصيد التراكمي الآن</span>
<span class="font-mono text-xl font-bold text-primary-container">272,000 د.ع</span>
</div>
<!-- Progress Section -->
<div class="flex flex-col space-y-2 pt-2">
<div class="w-full h-2 bg-teal-tint rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full" style="width: 75%;"></div>
</div>
<div class="flex justify-between items-center text-xs">
<span class="text-signal-amber font-medium">تبقّى 78,000 د.ع للوصول لخصم 5٪</span>
</div>
</div>
<!-- WhatsApp Notification Chip -->
<div class="flex items-center justify-center w-full pt-4">
<div class="bg-[#E6F4EA] text-signal-green px-4 py-2 rounded-full flex items-center space-x-2 space-x-reverse border border-[#BCE4CA]">
<span class="material-symbols-outlined" style="font-size: 16px;">check_circle</span>
<span class="text-sm font-semibold">تم إرسال إشعار واتساب</span>
</div>
</div>
</div>
<!-- Discount Milestone Banner (Variant State) -->
<div class="w-full bg-teal-tint border border-inverse-primary rounded-xl p-4 flex items-center space-x-3 space-x-reverse shadow-sm">
<div class="bg-pure-surface w-10 h-10 rounded-full flex items-center justify-center shadow-sm flex-shrink-0 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<span class="text-primary-container font-semibold text-sm leading-tight">استحق الزبون خصم 5٪ على الزيارة القادمة!</span>
</div>
</div>

<div class="mt-8 flex flex-col space-y-3 w-full">
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-lg font-bold text-lg hover:bg-primary transition-colors active:scale-95 duration-150 shadow-sm flex items-center justify-center space-x-2 space-x-reverse">
