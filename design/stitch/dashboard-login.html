<body class="bg-canvas text-on-surface antialiased">
<div class="auth-container">
<!-- Right Panel (Authentication) - Takes up 55% on desktop -->
<main class="w-full md:w-[55%] bg-pure-surface flex flex-col justify-center px-6 py-12 md:px-16 lg:px-24 flex-grow shrink-0 order-2 md:order-1 relative z-10 md:shadow-[0_0_40px_rgba(0,0,0,0.03)]">
<div class="max-w-md w-full mx-auto md:mx-0">

<div class="flex items-center gap-3 mb-12">
<div class="w-10 h-10 bg-primary-container text-on-primary-container rounded-lg flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="cairo-font text-3xl font-bold text-primary">ولاء</h1>
</div>
<!-- Header -->
<div class="mb-8">
<h2 class="cairo-font text-headline-lg font-bold text-charcoal-ink mb-2">تسجيل الدخول</h2>
<p class="font-body-md text-body-md text-muted-steel">لوحة تحكم المدير</p>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Field 1: Phone / Email -->
<div>
<label class="block font-label-sm text-label-sm text-charcoal-ink mb-2" for="identifier">رقم الهاتف أو البريد الإلكتروني</label>
<input class="w-full h-12 px-4 border border-whisper-border rounded-lg bg-canvas text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md outline-none" id="identifier" name="identifier" placeholder="أدخل بريدك الإلكتروني أو رقم الهاتف" required="" type="text"/>
</div>
<!-- Field 2: Password -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-label-sm text-charcoal-ink" for="password">كلمة المرور</label>
</div>
<div class="relative">
<input class="w-full h-12 pl-12 pr-4 border border-whisper-border rounded-lg bg-canvas text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Toggle Password Visibility (Left side in RTL) -->
<button class="absolute left-0 top-0 h-12 w-12 flex items-center justify-center text-secondary hover:text-primary transition-colors focus:outline-none rounded-l-lg" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-start pt-1">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>

<div class="pt-4">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg cairo-font font-bold text-lg flex items-center justify-center hover:bg-primary-container active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                            دخول
                        </button>
</div>
</form>
</div>
</main>
<!-- Left Panel (Branded Zone) - Takes up 45% on desktop -->
<aside class="w-full md:w-[45%] h-64 md:h-auto bg-primary-container relative overflow-hidden order-1 md:order-2 shrink-0 flex items-center justify-center">
<!-- Background Animation Shader -->
<!-- STITCH_SHADER_START:ANIMATION_4 class="absolute inset-0 w-full h-full mix-blend-overlay opacity-80 pointer-events-none" -->
<div class="absolute inset-0 w-full h-full mix-blend-overlay opacity-80 pointer-events-none" style="display:block;">
<canvas id="shader-canvas-ANIMATION_4" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_4');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    // Center coordinates and adjust for aspect ratio
    vec2 uv = (v_texCoord - 0.5) * 2.0;
    uv.x *= u_resolution.x / u_resolution.y;

    // Deep Teal background (#0F6E56)
    vec3 color = vec3(0.0588, 0.4314, 0.3373);
    
    // Create a subtle geometric pattern with thin lines
    float pattern = 0.0;
    
    // Rotate uv for diagonal lines
    float angle = 0.7854; // 45 degrees
    mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
    vec2 rotatedUv = rot * uv;
    
    // Grid of lines
    float lineThickness = 0.002;
    float lineSpacing = 0.15;
    
    float lines1 = smoothstep(lineThickness, 0.0, abs(mod(rotatedUv.x + u_time * 0.01, lineSpacing) - lineSpacing * 0.5));
    float lines2 = smoothstep(lineThickness, 0.0, abs(mod(rotatedUv.y - u_time * 0.01, lineSpacing) - lineSpacing * 0.5));
    
    pattern = max(lines1, lines2) * 0.15; // Muted intensity
    
    // Add some variation to the pattern
    pattern *= 0.8 + 0.2 * sin(rotatedUv.x * 5.0 + u_time * 0.2);
    
    color += pattern;

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<p class="font-body-md text-on-primary-container/80 leading-relaxed">
                    نظام متكامل لإدارة ولاء العملاء، تحليل البيانات، ومتابعة أداء الفروع بدقة وكفاءة عالية.
                </p>

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
