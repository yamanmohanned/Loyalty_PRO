packages:
  - "apps/*"
  - "packages/*"
  - "packaging"

# Third-party type definitions need @types/react resolvable from their OWN directory.
#
# `.npmrc` excludes `@types/*` from pnpm's hoist so that each app sees the React types
# it declares (docs/legacy/CLAUDE_v3.md §12.24). It was written when the workspace held React 18
# (Station, manager desktop) and React 19 (the Next dashboard, removed in v4). Only
# React 18 remains — and both settings stay, for the reason spelled out in `.npmrc`:
# the failure they prevent is silent and lands in a package nobody edited. That is
# correct for the apps and leaves a gap for
# packages that ship their own `.d.ts` files: recharts' types do `import * as React from
# 'react'`, TypeScript resolves that by walking up from the recharts directory inside
# the store, and with nothing hoisted there is no `@types/react` anywhere on that path.
# The symptom is `TS2786: 'XAxis' cannot be used as a JSX component` in a file nobody
# touched — the same shape of failure §12.24 records, one layer along.
#
# Declaring the peer here makes pnpm link the RIGHT @types/react into each recharts
# instance — one copy per instance, however many React versions the workspace holds.
# Restoring the global hoist would also silence it, and would put back exactly the bug
# §12.24 exists to prevent: one version winning for every app.
packageExtensions:
  recharts:
    peerDependencies:
      "@types/react": "*"
  react-router-dom:
    peerDependencies:
      "@types/react": "*"
