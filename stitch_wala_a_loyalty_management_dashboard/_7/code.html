<body class="bg-canvas text-on-surface font-body-md antialiased min-h-[884px] flex flex-col selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<!-- As per json rules, using exact values but matching layout structurally. We only have the TopAppBar JSON to guide us, but wait, the prompt doesn't specify JSON for this exact screen nav except a back chevron and title. 
    Actually, the TopAppBar json provided in the prompt is for "أسواق المركز". The prompt says: Top bar: right-pointing back chevron + title "تسجيل زبون جديد".
    So I will build a custom top bar matching the style guidance. -->
<header class="w-full top-0 sticky bg-surface border-b border-whisper-border z-10">
<div class="flex flex-row justify-start items-center px-gutter h-16 w-full gap-4">
<button aria-label="Back" class="p-2 -mr-2 rounded-full hover:bg-surface-container-low active:scale-95 transition-transform duration-150 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">تسجيل زبون جديد</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-padding-card-mobile py-6 gap-6 max-w-[600px] w-full mx-auto pb-32">
<!-- Registration Form -->
<form class="flex flex-col gap-5 w-full">
<!-- Customer Name -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="customerName">اسم الزبون</label>
<div class="relative w-full">
<input class="w-full h-12 px-4 bg-pure-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-on-surface font-body-md shadow-sm" id="customerName" name="customerName" placeholder="أدخل اسم الزبون..." type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phoneNumber">رقم الهاتف</label>
<div class="relative w-full flex items-center bg-pure-surface border border-outline-variant rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary shadow-sm overflow-hidden h-12">
<span class="px-4 text-on-surface-variant font-amount-display text-amount-display border-l border-whisper-border bg-surface-container-lowest h-full flex items-center select-none" dir="ltr">+964</span>
<input class="w-full h-full px-4 bg-transparent border-none outline-none text-on-surface font-amount-display text-amount-display tracking-widest text-left" dir="ltr" id="phoneNumber" name="phoneNumber" placeholder="07XX XXX XXXX" type="tel"/>
</div>
<p class="text-[13px] text-on-secondary-container mt-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">info</span>
                    سيُرسَل كود الزبون إلى هذا الرقم عبر واتساب
                </p>
</div>
<!-- Category Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="category">الفئة</label>
<div class="relative w-full">
<select class="w-full h-12 px-4 pr-4 pl-10 bg-pure-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-on-surface font-body-md shadow-sm appearance-none cursor-pointer" id="category" name="category">
<option selected="" value="عادي">عادي</option>
<option value="جملة">جملة</option>
<option value="كبار المشترين">كبار المشترين</option>
</select>
<!-- Custom Arrow for Select -->
<div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</form>
<!-- Info Strip -->
<div class="mt-4 bg-teal-tint/50 border border-primary-fixed-dim/30 rounded-xl p-4 flex items-start gap-3 shadow-sm">
<span class="material-symbols-outlined text-primary mt-0.5 shrink-0" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                يُنشأ للزبون كود QR دائم يُستخدم في كل زيارة لتسهيل العمليات.
            </p>
</div>
</main>
<!-- Bottom Thumb Zone (Primary Action) -->
<!-- Fixed to bottom for mobile ergonomics -->
<div class="fixed bottom-0 left-0 w-full bg-pure-surface border-t border-whisper-border p-4 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.02)] z-20">
<div class="max-w-[600px] mx-auto w-full">
<button class="w-full h-[52px] bg-primary text-on-primary font-label-sm text-label-sm font-semibold rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform duration-150 shadow-sm hover:bg-primary-container" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">send</span>
                إنشاء الحساب وإرسال الكود
            </button>
