<body class="bg-canvas min-h-[884px] font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-padding-card-mobile">
<!-- Main Container -->
<main class="w-full max-w-sm flex flex-col gap-8">
<!-- Top Section: Logo -->
<header class="flex flex-col items-center justify-center text-center gap-2 mt-8">
<div class="w-16 h-16 rounded-full bg-teal-tint flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">ولاء</h1>
<p class="font-body-md text-body-md text-on-surface-variant">تطبيق المساعد</p>
</header>
<!-- Middle Section: Login Form -->
<section class="bg-pure-surface rounded-xl shadow-sm border border-whisper-border p-padding-card-mobile flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="username">اسم المستخدم</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest border border-whisper-border rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant" id="username" name="username" placeholder="أدخل اسم المستخدم" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">كلمة المرور</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container-lowest border border-whisper-border rounded-lg pl-12 pr-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="أدخل كلمة المرور" type="password"/>
<button aria-label="Show password" class="absolute left-4 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</section>
<!-- Bottom Section: Actions (Thumb Zone) -->
<footer class="flex flex-col items-center gap-4 mt-auto mb-8">
<button class="w-full h-[52px] bg-primary-container text-on-primary-container rounded-lg font-body-md text-body-md font-semibold active:scale-[0.98] transition-transform flex items-center justify-center shadow-sm" type="button">
                دخول
            </button>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center">
                للدعم تواصل مع الإدارة
            </p>
</footer>
