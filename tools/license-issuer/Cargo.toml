[package]
name = "license-issuer"
version = "0.3.1"
edition = "2021"
publish = false
description = "Issues ولاء license codes. Holds the private key. Never shipped with the application."

[[bin]]
name = "license-issuer"
path = "src/main.rs"

[dependencies]
walaa-license = { path = "../../crates/walaa-license" }
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
